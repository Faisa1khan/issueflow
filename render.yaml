services:
  - type: web
    name: issueflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: issueflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TTL_DAYS
        value: "30"
      - key: MAX_QUERY_DEPTH
        value: "8"
      - key: RATE_LIMIT_POINTS
        value: "120"
      - key: NODE_ENV
        value: production

databases:
  - name: issueflow-db
    plan: free
    databaseName: issueflow
    user: issueflow
