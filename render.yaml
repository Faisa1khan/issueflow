services:
  - type: web
    name: issueflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: issueflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TTL_DAYS
        value: "30"
      - key: MAX_QUERY_DEPTH
        value: "8"
      - key: RATE_LIMIT_POINTS
        value: "120"
      - key: NODE_ENV
        value: production
      # Set after the Vercel client has a URL: the browser origin allowed to call this API.
      # Comma-separated for preview + production. Without it, CORS falls back to localhost.
      - key: CLIENT_ORIGIN
        sync: false
      # Optional. Without it the rate limiter is per-instance memory, not a shared counter.
      # Render exposes Redis as a separate service; paste its internal URL here.
      - key: REDIS_URL
        sync: false
      # Render terminates TLS and forwards exactly one hop.
      - key: TRUST_PROXY
        value: "1"

databases:
  - name: issueflow-db
    plan: free
    databaseName: issueflow
    user: issueflow
